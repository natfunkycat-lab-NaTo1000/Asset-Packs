# ConductorX — nginx reverse-proxy config
# TLS certificates managed by certbot (Let's Encrypt)
#
# Usage:
#   cp gateway/nginx.conf /etc/nginx/sites-available/conductorx
#   ln -s /etc/nginx/sites-available/conductorx /etc/nginx/sites-enabled/
#   certbot --nginx -d yourdomain.com
#   nginx -t && systemctl reload nginx

upstream webhook_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream payment_backend {
    server 127.0.0.1:8001;
    keepalive 32;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com;

    # TLS — certbot will populate these automatically
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10M;

    # ── webhook server ────────────────────────────────────────────────────────
    location ~ ^/(github|health|pipeline|trigger) {
        proxy_pass         http://webhook_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
    }

    # ── payment server ────────────────────────────────────────────────────────
    location / {
        proxy_pass         http://payment_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 30s;
    }

    # Logging
    access_log /var/log/nginx/conductorx_access.log;
    error_log  /var/log/nginx/conductorx_error.log warn;
}
