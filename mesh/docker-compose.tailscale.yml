version: "3.9"

# ConductorX Mesh — Tailscale sidecar pattern.
# Add the tailscale service alongside any other service to connect it to the mesh.
#
# Usage:
#   TAILSCALE_AUTH_KEY=tskey-auth-xxxxx \
#   CONDUCTOR_HOSTNAME=mydevice \
#   docker compose -f mesh/docker-compose.tailscale.yml up -d

services:
  tailscale:
    image: tailscale/tailscale:stable
    container_name: conductor-tailscale
    hostname: ${CONDUCTOR_HOSTNAME:-conductor-node}
    environment:
      - TS_AUTHKEY=${TAILSCALE_AUTH_KEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    volumes:
      - tailscale-state:/var/lib/tailscale
    # NOTE: /dev/net/tun requires TUN/TAP kernel support on the host.
    # Available on most Linux VMs and bare-metal; may be unavailable on
    # some cloud providers (e.g. certain GCP/Azure container instances).
    # Use TS_USERSPACE=true as an alternative if TUN is unavailable.
    - /dev/net/tun:/dev/net/tun
  cap_add:
    - NET_ADMIN
    - NET_RAW
  network_mode: host
  restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: conductor-redis
    network_mode: service:tailscale
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

volumes:
  tailscale-state:
  redis-data:
